  "fidelity": {
    "divergences": "The manuscript defines tau_n as the greatest realizable cardinality. The implementation constructs that number by a bounded search and separately proves its IsGreatest property. The Palomar interface instead states existence of an attained maximum and formulates the number-level consequences for any function of genuine maxima. Solution proves these adapters from the implementation, so there is no extra geometric assumption, cutoff, or weakening of the quantifiers. Universal bases are stated as nonnegative; the theorem characterizes them as alpha >= sqrt(6), hence also gives the manuscript formulation for positive bases. The manuscript uses a lower estimate for the volume of the same four-dimensional body whose exact volume the certificate computes. The cap-area proof and its unique-equality corollary are informal."
