    "name": "The optimal universal exponential base for Euclidean kissing numbers",
    "description": "For every positive integer n, the Euclidean kissing number tau_n is an attained maximum and satisfies tau_n <= (sqrt(6))^n. This Lean formalization proves the bound by packing explicit bodies of revolution in the unit ball, including the geometric separation, volume integrals, and every dimension case. An explicit six-point planar configuration proves tau_2 = 6. Consequently sqrt(6) is the least nonnegative (and least positive) universal exponential base without a prefactor; the admissible bases are exactly alpha >= sqrt(6), and the supremum of tau_n^(1/n) over positive dimensions equals sqrt(6). No asymptotic-optimality claim is made.",
