      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-fonts-recommended texlive-latex-base \
            texlive-latex-extra texlive-latex-recommended
      - name: Compile the manuscript twice and reject TeX errors
        working-directory: manuscript
        env:
          SOURCE_DATE_EPOCH: '1788470400'
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error sqrt6-kissing-bound.tex
          test -s sqrt6-kissing-bound.pdf
          if grep -Eq 'There were undefined references|LaTeX Error|Undefined control sequence' sqrt6-kissing-bound.log; then
            cat sqrt6-kissing-bound.log
            exit 1
          fi
      - name: Regenerate source checksums
        shell: bash
        run: |
          find Sqrt6KissingBound -type f -name '*.lean' -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256SUMS
          sha256sum Sqrt6KissingBound.lean Axioms.lean manuscript/sqrt6-kissing-bound.tex \
            manuscript/sqrt6-kissing-bound.pdf >> SOURCE_SHA256SUMS
      - name: Commit the certified manuscript and documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md FORMALIZATION_SCOPE.md CERTIFICATION_STATUS.md SOURCE_SHA256SUMS \
            manuscript/sqrt6-kissing-bound.tex manuscript/sqrt6-kissing-bound.pdf
          git add -u MATHOVERFLOW_ANSWER.md || true
          git commit -m 'Update the manuscript for the complete Lean certificate'
          git pull --rebase origin gpt-pro/full-lean-certificate
          git push origin HEAD:gpt-pro/full-lean-certificate
