name: Update certified manuscript

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - '.github/workflows/update-certified-manuscript.yml'

concurrency:
  group: update-certified-manuscript
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
          fetch-depth: 0
      - name: Wait for theorem finalization and refresh
        run: |
          sleep 120
          git fetch origin gpt-pro/full-lean-certificate
          git reset --hard origin/gpt-pro/full-lean-certificate
          test -s Sqrt6KissingBound/KissingNumber.lean
          test -s Sqrt6KissingBound/Optimality.lean
      - name: Write the fully certified manuscript
        shell: bash
        run: |
          cat > manuscript/sqrt6-kissing-bound.tex <<'TEX'
          \documentclass[11pt,a4paper]{article}

          \usepackage[T1]{fontenc}
          \usepackage[utf8]{inputenc}
          \usepackage{lmodern}
          \usepackage{microtype}
          \usepackage[margin=1.02in]{geometry}
          \usepackage{amsmath,amssymb,amsthm,mathtools}
          \usepackage[hidelinks]{hyperref}
          \hypersetup{
            pdftitle={A Universal Square-Root-of-Six Bound for Kissing Numbers},
            pdfauthor={Sebastien Palcoux}
          }
          \usepackage{xurl}

          \newtheorem{theorem}{Theorem}
          \newtheorem{lemma}[theorem]{Lemma}
          \newtheorem{corollary}[theorem]{Corollary}
          \theoremstyle{remark}
          \newtheorem{remark}[theorem]{Remark}

          \newcommand{\R}{\mathbb{R}}
          \newcommand{\vol}{\operatorname{vol}}

          \title{A Universal Square-Root-of-Six Bound for Kissing Numbers}
          \author{S\'ebastien Palcoux}
          \date{September 4, 2026}

          \begin{document}

          \maketitle

          \begin{abstract}
          Let $\tau_n$ denote the kissing number in Euclidean dimension $n$.  We give an elementary proof that
          \[
          \tau_n\leq (\sqrt6)^n
          \qquad(n\geq1).
          \]
          The constant $\sqrt6$ is optimal among bounds of the form $\tau_n\leq\alpha^n$ required to hold in every dimension, since $\tau_2=6$.  The proof packs explicit bodies of revolution into the disjoint $30^\circ$ cones determined by a kissing configuration.  A bicone works in all dimensions except three and four, where slightly larger elementary profiles are used.  The complete argument, including the definition of the kissing number as a maximum and the optimality assertion, has been formalized in Lean~4 with Mathlib.
          \end{abstract}

          \begin{center}
          \begin{minipage}{0.9\textwidth}
          \small
          \textbf{AI provenance and verification status.}
          The mathematical proof, its Lean~4 formalization, and the first draft of this manuscript were generated by OpenAI's GPT-5.6 Pro from prompts supplied by the author.  The end-to-end theorem and the optimality of the constant are checked by Lean~4/Mathlib; see Section~\ref{sec:lean}.  The present version has not undergone independent human mathematical review.
          \end{minipage}
          \end{center}

          \section{Statement}

          A kissing configuration in $\R^n$ can be represented by a finite subset $X$ of the unit sphere such that
          \[
          \langle x,z\rangle\leq\frac12
          \qquad(x,z\in X,\ x\neq z).
          \]
          Its largest possible cardinality is the kissing number $\tau_n$.

          \begin{theorem}\label{thm:main}
          For every integer $n\geq1$,
          \[
          \tau_n\leq(\sqrt6)^n.
          \]
          \end{theorem}

          \begin{corollary}\label{cor:optimal}
          The least real number $\alpha>0$ such that $\tau_n\leq\alpha^n$ for every $n\geq1$ is $\sqrt6$.  Equivalently,
          \[
          \sup_{n\geq1}\tau_n^{1/n}=\sqrt6.
          \]
          \end{corollary}

          \section{Cone packing}

          Write $B_n$ for the open unit ball in $\R^n$ and $V_n=\vol(B_n)$.  For a unit vector $x$, consider the open circular cone
          \[
          C_x:=\left\{y\in\R^n:\ \langle x,y\rangle>
          \frac{\sqrt3}{2}\|y\|\right\}.
          \]
          Its half-angle is $\pi/6$.

          \begin{lemma}\label{lem:cones}
          If $x$ and $z$ are unit vectors with $\langle x,z\rangle\leq1/2$, then $C_x\cap C_z=\varnothing$.
          \end{lemma}

          \begin{proof}
          Suppose that $0\neq y\in C_x\cap C_z$ and put $u=y/\|y\|$,
          \[
          a=\langle x,u\rangle,
          \qquad b=\langle z,u\rangle,
          \qquad p=x-au,
          \qquad q=z-bu.
          \]
          Then $a,b>\sqrt3/2$, while
          \[
          \|p\|^2=1-a^2<\frac14,
          \qquad
          \|q\|^2=1-b^2<\frac14.
          \]
          By Cauchy--Schwarz,
          \[
          \langle x,z\rangle=ab+\langle p,q\rangle
          >\frac34-\frac14=\frac12,
          \]
          a contradiction.
          \end{proof}

          Let $e=(1,0,\ldots,0)$.  If a measurable set $S\subset C_e\cap B_n$ is given, an orthogonal transformation carrying $e$ to each $x\in X$ produces a congruent copy $S_x\subset C_x\cap B_n$.  Lemma~\ref{lem:cones} makes these copies pairwise disjoint, so
          \begin{equation}\label{eq:master-packing}
          |X|\,\vol(S)\leq V_n.
          \end{equation}

          We shall use bodies of revolution.  For an interval $I\subset\R$ and a nonnegative profile $g:I\to\R$, set
          \[
          R(I,g):=\{(t,v)\in\R\times\R^{n-1}:t\in I,\ \|v\|<g(t)\}.
          \]
          Fubini's theorem gives
          \begin{equation}\label{eq:profile-volume}
          \vol R(I,g)=V_{n-1}\int_I g(t)^{n-1}\,dt.
          \end{equation}

          \section{The standard bicone}

          Put
          \[
          s=\sqrt3,
          \qquad a=\frac{s}{2},
          \]
          and define
          \[
          g_-(t)=\frac{t}{s}\quad(0<t<a),
          \qquad
          g_+(t)=(2+s)(1-t)\quad(a<t<1).
          \]
          The two profiles meet at height $a$ with radius $1/2$.  They define an open bicone $S_n$.

          The cone $C_e$ has radial profile $t/s$, and the ball $B_n$ has radial profile $\sqrt{1-t^2}$.  Thus $g_-$ lies on the cone boundary.  For $a\leq t\leq1$,
          \[
          \frac{t}{s}-g_+(t)
          =\left(\frac1s+2+s\right)(t-a)\geq0.
          \]
          Moreover,
          \[
          1-t^2-g_+(t)^2
          =(1-t)\bigl(1+t-(2+s)^2(1-t)\bigr)\geq0,
          \]
          because the second factor vanishes at $t=a$ and is increasing.  Hence
          \[
          S_n\subset C_e\cap B_n.
          \]

          A direct integration gives
          \begin{align}
          \beta_n
          &:={\int_0^a\left(\frac{t}{s}\right)^{n-1}dt}
          +{\int_a^1\bigl((2+s)(1-t)\bigr)^{n-1}dt} \notag\\
          &=\frac{s}{n2^n}+\frac{2-s}{n2^n}
          =\frac1{n2^{n-1}}.\label{eq:bicone-profile}
          \end{align}
          Therefore \eqref{eq:master-packing} and \eqref{eq:profile-volume} imply
          \begin{equation}\label{eq:bicone-bound}
          |X|\leq n2^{n-1}\frac{V_n}{V_{n-1}}.
          \end{equation}

          In dimension two, $V_1=2$ and $V_2=\pi$, so $|X|\leq2\pi<7$ and therefore $|X|\leq6=(\sqrt6)^2$.

          In dimension five,
          \[
          V_4=\frac{\pi^2}{2},
          \qquad
          V_5=\frac{8\pi^2}{15},
          \]
          and \eqref{eq:bicone-bound} gives $|X|\leq256/3<86$.  Thus $|X|\leq85<36\sqrt6=(\sqrt6)^5$.

          For $n\geq6$, the unit-ball volumes are nonincreasing:
          \begin{equation}\label{eq:volume-monotone}
          V_n\leq V_{n-1}.
          \end{equation}
          Here is a short verification.  The recurrence
          \[
          V_{m+2}=\frac{2\pi}{m+2}V_m
          \]
          together with
          \[
          V_5=\frac{8\pi^2}{15},\qquad
          V_6=\frac{\pi^3}{6},\qquad
          V_7=\frac{16\pi^3}{105}
          \]
          gives $V_6<V_5$ and $V_7<V_6$.  If $n\geq8$ and $V_{n-2}\leq V_{n-3}$, then
          \[
          V_n=\frac{2\pi}{n}V_{n-2}
          \leq\frac{2\pi}{n}V_{n-3}
          \leq\frac{2\pi}{n-1}V_{n-3}=V_{n-1},
          \]
          proving \eqref{eq:volume-monotone} by induction.

          Consequently, \eqref{eq:bicone-bound} yields
          \[
          |X|\leq n2^{n-1}.
          \]
          Finally,
          \begin{equation}\label{eq:numerical}
          n2^{n-1}\leq6^{n/2}\qquad(n\geq6).
          \end{equation}
          Indeed, it holds for $n=6,7$, and passage from $n$ to $n+2$ multiplies the left-hand side by $4(n+2)/n\leq6$ and the right-hand side by $6$.

          \section{Dimensions three and four}

          The bicone is slightly too small in dimensions three and four, so we enlarge its upper half.

          \subsection*{Dimension three}

          Keep $g_-(t)=t/s$ on $(0,a)$ and use the spherical profile
          \[
          g_3(t)=\sqrt{1-t^2}\qquad(a<t<1).
          \]
          Since $t>a$ implies $t^2>3/4$, this profile lies inside $C_e$ as well as on the boundary of $B_3$.  Its total profile integral is
          \begin{align*}
          \beta_3
          &=\int_0^a\left(\frac{t}{s}\right)^2dt
            +\int_a^1(1-t^2)dt\\
          &=\frac{s}{24}+\frac23-\frac{3s}{8}
            =\frac{2-s}{3}.
          \end{align*}
          Since $s<26/15$, one has $\beta_3>4/45$.  The resulting body has volume
          \[
          V_2\beta_3>\frac{4\pi}{45}=\frac{V_3}{15}.
          \]
          Thus \eqref{eq:master-packing} gives $|X|<15$, hence
          \[
          |X|\leq14<6\sqrt6=(\sqrt6)^3.
          \]

          \subsection*{Dimension four}

          Again retain $g_-$ below $a$, and for $a<t<1$ set
          \[
          g_4(t)=(1-t)(14t+2-6s).
          \]
          This function is nonnegative on $[a,1]$.  To check that it lies under the spherical profile, put
          \[
          H(t)=14t+2-6s,
          \qquad
          q(t)=196t^2-(140+70s)t-48+74s.
          \]
          Direct expansion gives
          \begin{align*}
          1+t-(1-t)H(t)^2&=(t-a)q(t),\\
          q(t)&=(-6+4s)+(t-a)\bigl(196(t+a)-(140+70s)\bigr).
          \end{align*}
          For $t\geq a$, both summands in the second line are nonnegative: it is enough to use $s>3/2$ and $s>10/9$.  Therefore
          \[
          1-t^2-g_4(t)^2
          =(1-t)(t-a)q(t)\geq0.
          \]
          Since $t^2\geq3/4$, lying in the ball also places this profile inside $C_e$.

          Polynomial integration gives
          \[
          \int_a^1g_4(t)^3dt=\frac{33169-19150s}{40}.
          \]
          Hence the total profile integral equals
          \begin{equation}\label{eq:beta4}
          \beta_4=\frac{s}{64}+\frac{33169-19150s}{40}
          =\frac{265352-153195s}{320}.
          \end{equation}
          The Pell identity
          \[
          1351^2-3\cdot780^2=1
          \]
          implies $s<1351/780$, and direct rational arithmetic in \eqref{eq:beta4} gives
          \[
          \beta_4>\frac{33}{1036}.
          \]
          Since $\pi<22/7$, we also have $3\pi/296<33/1036$.  Therefore the resulting four-dimensional body has volume
          \[
          V_3\beta_4>
          \frac{4\pi}{3}\frac{3\pi}{296}
          =\frac{\pi^2}{74}
          =\frac{V_4}{37}.
          \]
          Packing gives $|X|<37$, and therefore
          \[
          |X|\leq36=(\sqrt6)^4.
          \]

          \section{Dimension one and optimality}

          The one-dimensional unit sphere consists of two points, so $\tau_1=2<\sqrt6$.  Together with the preceding sections, this proves Theorem~\ref{thm:main}.

          Six equally spaced points on the unit circle form a kissing configuration, while the dimension-two upper bound proved above gives $\tau_2\leq6$.  Hence $\tau_2=6$.  If $\tau_n\leq\alpha^n$ for all $n$ and $\alpha\geq0$, then
          \[
          6=\tau_2\leq\alpha^2,
          \]
          so $\alpha\geq\sqrt6$.  Theorem~\ref{thm:main} shows that equality is attainable, proving Corollary~\ref{cor:optimal}.

          \begin{remark}
          The purpose of the argument is not to approach the best high-dimensional asymptotic bounds.  It determines the optimal base in a prefactor-free estimate $\tau_n\leq\alpha^n$ required to hold simultaneously in every dimension; the obstruction comes from $n=2$.
          \end{remark}

          \section{Lean certification}\label{sec:lean}

          The accompanying Lean project is available at
          \begin{center}
          \url{https://github.com/sebastienpalcoux/sqrt6-kissing-bound}.
          \end{center}
          It uses Lean~4.33.1 and a pinned Mathlib revision.  The formal development defines finite kissing configurations by the unit-norm and inner-product conditions above, proves the cone-separation lemma, develops the product-coordinate volume formula for bodies of revolution, constructs and evaluates all the packing bodies used in the proof, establishes the ball-volume and numerical inductions, and treats dimensions one through five separately.

          The declaration
          \begin{center}
          \texttt{kissingConfiguration\_card\_le\_sqrt6\_pow}
          \end{center}
          proves the bound for every finite configuration.  The project then defines \texttt{kissingNumber n} as the greatest realizable cardinality and proves
          \begin{center}
          \texttt{kissingNumber\_le\_sqrt6\_pow}.
          \end{center}
          A formal regular hexagon yields \texttt{kissingNumber\_two\_eq\_six}, and
          \begin{center}
          \texttt{sqrt6\_isLeast\_universalKissingBase}
          \end{center}
          proves the optimality assertion.

          The repository's continuous-integration check runs
          \begin{verbatim}
          lake build
          lake env lean Axioms.lean
          bash scripts/check.sh
          \end{verbatim}
          together with an axiom audit and a source scan rejecting \texttt{sorry}, \texttt{admit}, \texttt{native\_decide}, and project-defined axioms.  Thus the certification is end-to-end: the geometric and analytic inputs that were hypotheses in the preliminary certificate have been eliminated.

          \section*{Acknowledgment}
          This note was prompted by the MathOverflow question ``Upper bound of the kissing number in $n$ dimensions'' and by Henry Cohn's answer concerning effective spherical-code bounds.

