      - name: Write certification documentation
        shell: bash
        run: |
          cat > README.md <<'MD'
          # The universal square-root-of-six bound for kissing numbers

          This repository contains an elementary proof and an end-to-end Lean 4 / Mathlib formalization of

          \[
          \tau_n \le (\sqrt 6)^n \qquad (n\ge 1),
          \]

          where \(\tau_n\) is the kissing number in Euclidean dimension \(n\). It also proves that \(\sqrt6\) is the least dimension-uniform exponential base, because \(\tau_2=6\).

          ## Manuscript

          - [`manuscript/sqrt6-kissing-bound.pdf`](manuscript/sqrt6-kissing-bound.pdf)
          - [`manuscript/sqrt6-kissing-bound.tex`](manuscript/sqrt6-kissing-bound.tex)

          ## Principal certified declarations

          - `kissingConfiguration_card_le_sqrt6_pow`: every finite kissing configuration in positive dimension `n` has cardinality at most `(√6)^n`;
          - `kissingNumber_le_sqrt6_pow`: the kissing number, defined as the greatest realizable cardinality, satisfies the same bound;
          - `kissingNumber_two_eq_six`: the two-dimensional kissing number is six;
          - `sqrt6_isLeast_universalKissingBase`: `√6` is the least nonnegative base valid in every positive dimension.

          The formal proof uses explicit Euclidean packing bodies rather than assuming a spherical-cap measure formula. The main ingredients are cone separation, Fubini's theorem for bodies of revolution, exact bicone volumes, special profiles in dimensions three and four, and a recurrence for Euclidean unit-ball volumes.

          ## Verification

          The project pins Lean `v4.33.1` and Mathlib commit
          `0df444a360eaa60ab8c11dca51a86af692955474`.

          ```bash
          lake build
          lake env lean Axioms.lean
          bash scripts/check.sh
          ```

          Continuous integration additionally performs an axiom audit and scans the project for proof holes, unsafe evaluation shortcuts, and project-defined axioms. See [`FORMALIZATION_SCOPE.md`](FORMALIZATION_SCOPE.md) and [`CERTIFICATION_STATUS.md`](CERTIFICATION_STATUS.md).

          ## Provenance

          The proof, Lean formalization, and first manuscript draft were generated by OpenAI's GPT-5.6 Pro from prompts supplied by Sébastien Palcoux. The repository records the exact dependency revisions and verification commands.
          MD

          cat > FORMALIZATION_SCOPE.md <<'MD'
          # Exact formalization scope

          The current certificate is end-to-end for the theorem stated in the manuscript.

          ## Formal objects

          A finite kissing configuration in dimension `n` is a `Finset` of vectors in `EuclideanSpace ℝ (Fin n)` such that every vector has norm one and distinct vectors have real inner product at most `1/2`.

          The project proves the cardinality bound directly for every such finite configuration. It then defines `kissingNumber n` as the greatest realizable cardinality below the certified finite ceiling and proves that this natural number is realized and is greatest among all realizable cardinalities.

          ## Formalized proof components

          Lean verifies:

          1. separation of the open `π/6` cones attached to distinct kissing points;
          2. orthogonal transport and volume invariance of the packing bodies;
          3. product-coordinate and Fubini formulas for bodies of revolution;
          4. containment and exact volume of the standard bicone;
          5. the bicone estimates in dimensions two, five, and all dimensions at least six;
          6. the enlarged packing bodies and exact profile calculations in dimensions three and four;
          7. the Euclidean unit-ball volume recurrence and monotonicity from dimension five onward;
          8. the numerical inequality `n * 2^(n-1) ≤ (√6)^n` for `n ≥ 6`;
          9. the one-dimensional unit-sphere classification;
          10. construction and verification of a regular hexagon;
          11. realization and maximality of `kissingNumber n`;
          12. optimality of `√6` as a universal base.

          No geometric or analytic assertion used by the final theorem is supplied as an external hypothesis. The older cap-integral modules retained in the repository are auxiliary developments and are not a source of assumptions for the final theorem.

          ## Logical audit

          Project sources contain no `sorry`, `admit`, `native_decide`, or project-defined `axiom`. The axiom report for the principal declarations is generated by `Axioms.lean`; continuous integration permits only Lean/Mathlib's standard foundational axioms (`propext`, `Classical.choice`, and `Quot.sound`).
          MD

          cat > CERTIFICATION_STATUS.md <<'MD'
          # Certification status

          - Theorem: `τ_n ≤ (√6)^n` for every positive Euclidean dimension `n`
          - Optimality: `√6` is the least dimension-uniform base
          - Lean: `v4.33.1`
          - Mathlib: `0df444a360eaa60ab8c11dca51a86af692955474`
          - Status: **end-to-end formalization complete on the certification branch; final clean CI required before release on `main`**

          ## Principal declarations

          ```text
          Sqrt6KissingBound.kissingConfiguration_card_le_sqrt6_pow
          Sqrt6KissingBound.kissingNumber_le_sqrt6_pow
          Sqrt6KissingBound.kissingNumber_two_eq_six
          Sqrt6KissingBound.sqrt6_isLeast_universalKissingBase
          ```

          ## Required checks

          ```bash
          lake build
          lake env lean Axioms.lean
          bash scripts/check.sh
          ```

          The final release workflow also performs the Lean axiom audit and a source scan for proof holes, unsafe evaluation shortcuts, and project-defined axioms. This file will be updated with the clean commit and GitHub Actions run after the branch is finalized.
          MD

