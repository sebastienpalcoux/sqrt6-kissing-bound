name: Verify Lean stage 2 caps

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - '.github/workflows/verify-stage2-caps.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          axiom-audit: false
          use-mathlib-cache: true
      - name: Verify cap disjointness
        shell: bash
        run: |
          test -f .ci/stage1.ok
          test -f Sqrt6KissingBound/SphericalCaps.lean
          lake build
          mkdir -p .ci
          printf 'stage 2 caps verified\n' > .ci/stage2-caps.ok
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/stage2-caps.ok
          git commit -m 'Record successful spherical-cap disjointness verification'
          git push origin HEAD:gpt-pro/full-lean-certificate
