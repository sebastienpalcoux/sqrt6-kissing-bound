name: Assemble full certificate 001

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - '.github/workflows/assemble-full-certificate-001.yml'

concurrency:
  group: assemble-full-certificate-001
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          axiom-audit: false
          use-mathlib-cache: true
      - name: Materialize the complete candidate chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflows = [
              "develop-profile-volume-001.yml",
              "develop-profile-integral-001.yml",
              "develop-profile-real-001.yml",
              "develop-standard-geometry-001.yml",
              "develop-linear-integrals-001.yml",
              "develop-bicone-geometry-001.yml",
              "develop-bicone-volume-001.yml",
              "develop-volume-packing-001.yml",
              "develop-centered-bicone-001.yml",
              "develop-centered-body-001.yml",
              "develop-ball-volumes-001.yml",
              "develop-dimension-one-001.yml",
              "develop-dimension-three-001.yml",
              "develop-dimension-four-001.yml",
              "develop-bicone-bounds-001.yml",
              "develop-main-bound-001.yml",
              "develop-optimality-001.yml",
              "develop-kissing-number-001.yml",
          ]
          workflow_dir = Path(".github/workflows")
          target_dir = Path("Sqrt6KissingBound")
          pattern = re.compile(
              r"cat > /tmp/(?P<name>[A-Za-z0-9_]+\.lean) <<'LEAN'\n"
              r"(?P<body>.*?)\n\s*LEAN\n",
              re.S,
          )
          for workflow in workflows:
              path = workflow_dir / workflow
              text = path.read_text(encoding="utf-8")
              match = pattern.search(text)
              if match is None:
                  raise RuntimeError(f"No Lean heredoc found in {path}")
              body = textwrap.dedent(match.group("body"))
              body = body.replace("PiLp.toLp", "WithLp.toLp")
              body = body.replace("intervalIntegral.integral_pow", "integral_pow")
              out = target_dir / match.group("name")
              out.write_text(body.rstrip() + "\n", encoding="utf-8")
              print(f"materialized {out}")
          PY
          git diff --stat
      - name: Compile the complete candidate chain
        shell: bash
        run: |
          set -euo pipefail
          lake build Sqrt6KissingBound.KissingNumber 2>&1 | tee full-certificate-build.log
      - name: Scan all theorem sources
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|[[:space:]])(sorry|admit|native_decide)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]'
          if grep -R -n -E "$pattern" --include='*.lean' Sqrt6KissingBound; then
            echo 'Forbidden proof hole, project-defined axiom, or unsafe evaluation shortcut found.' >&2
            exit 1
          fi
      - name: Show exact generated diff
        if: always()
        shell: bash
        run: |
          git status --short
          git diff --check || true
          git diff --stat
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-certificate-integration
          path: |
            full-certificate-build.log
            Sqrt6KissingBound/ProfileVolume.lean
            Sqrt6KissingBound/ProfileIntegral.lean
            Sqrt6KissingBound/ProfileIntegralReal.lean
            Sqrt6KissingBound/StandardGeometry.lean
            Sqrt6KissingBound/LinearProfileIntegral.lean
            Sqrt6KissingBound/BiconeGeometry.lean
            Sqrt6KissingBound/BiconeVolume.lean
            Sqrt6KissingBound/VolumePacking.lean
            Sqrt6KissingBound/CenteredBicone.lean
            Sqrt6KissingBound/CenteredBody.lean
            Sqrt6KissingBound/BallVolumes.lean
            Sqrt6KissingBound/DimensionOne.lean
            Sqrt6KissingBound/DimensionThree.lean
            Sqrt6KissingBound/DimensionFour.lean
            Sqrt6KissingBound/BiconeBounds.lean
            Sqrt6KissingBound/KissingBound.lean
            Sqrt6KissingBound/Optimality.lean
            Sqrt6KissingBound/KissingNumber.lean
          if-no-files-found: warn
          retention-days: 2
