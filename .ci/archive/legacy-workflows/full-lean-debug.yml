name: Development Lean check

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - 'Sqrt6KissingBound/**'
      - 'Sqrt6KissingBound.lean'
      - 'Axioms.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/full-lean-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          axiom-audit: false
          use-mathlib-cache: true
      - name: Development build (diagnostic only)
        shell: bash
        run: |
          set +e
          lake build 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          echo "LEAN_BUILD_STATUS=$status"
          # Development runs are deliberately non-failing, so iterative
          # diagnostics do not generate failure notifications.  The final
          # certification workflow is strict.
          exit 0
