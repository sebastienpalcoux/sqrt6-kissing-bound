name: Patch centered-bicone dependency

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - '.github/workflows/patch-centered-bicone-dependency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
          fetch-depth: 0
      - name: Build BiconeGeometry before CenteredBicone
        shell: bash
        run: |
          set -euo pipefail
          test -f Sqrt6KissingBound/BiconeGeometry.lean
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/develop-centered-bicone-001.yml')
          s = p.read_text()
          needle = '          lake env lean /tmp/CenteredBicone.lean\n'
          build = '          lake build Sqrt6KissingBound.BiconeGeometry\n'
          if 'lake build Sqrt6KissingBound.BiconeGeometry' not in s:
              if needle not in s:
                  raise SystemExit('Expected CenteredBicone compiler line not found')
              s = s.replace(needle, build + needle, 1)
          s += '\n# Explicitly builds the compiler-confirmed BiconeGeometry dependency.\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/develop-centered-bicone-001.yml
          git commit -m 'Build BiconeGeometry before CenteredBicone'
          git pull --rebase origin gpt-pro/full-lean-certificate
          git push origin HEAD:gpt-pro/full-lean-certificate
