name: Export current development source

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - '.github/workflows/export-current-source.yml'
  workflow_dispatch:

concurrency:
  group: export-current-source
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
          fetch-depth: 1
      - name: Package tracked source
        run: |
          git archive --format=tar.gz --output=current-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-development-source
          path: current-source.tar.gz
          compression-level: 0
          retention-days: 1
