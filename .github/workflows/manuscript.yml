name: Manuscript PDF

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended
      - name: Compile manuscript
        working-directory: manuscript
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error sqrt6-kissing-bound.tex
          test -s sqrt6-kissing-bound.pdf
          if grep -q 'There were undefined references' sqrt6-kissing-bound.log; then
            echo 'The manuscript contains unresolved references.' >&2
            exit 1
          fi
      - name: Upload manuscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqrt6-kissing-bound-manuscript
          path: manuscript/sqrt6-kissing-bound.pdf
