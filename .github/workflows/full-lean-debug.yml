name: Full Lean development

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          axiom-audit: false
          use-mathlib-cache: true
      - name: Build and capture diagnostics
        id: leanbuild
        shell: bash
        run: |
          set +e
          lake build 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-diagnostics
          path: lean-build.log
      - name: Fail on Lean errors
        if: steps.leanbuild.outputs.status != '0'
        run: exit 1
