name: Full Lean development

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - 'Sqrt6KissingBound/**'
      - 'Sqrt6KissingBound.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/full-lean-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          axiom-audit: false
          use-mathlib-cache: true
      - name: Build and capture diagnostics
        id: leanbuild
        shell: bash
        run: |
          set +e
          lake build 2>&1 | tee lean-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          mkdir -p .ci
          cp lean-build.log .ci/lean-build.log
          printf '%s\n' '${{ steps.leanbuild.outputs.status }}' > .ci/lean-build.status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/lean-build.log .ci/lean-build.status
          git commit -m 'Record Lean build diagnostics [skip ci]' || true
          git push origin HEAD:gpt-pro/full-lean-certificate
      - name: Fail on Lean errors
        if: steps.leanbuild.outputs.status != '0'
        run: exit 1
