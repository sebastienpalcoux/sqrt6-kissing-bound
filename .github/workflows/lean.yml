name: Lean certificate

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-certificate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: Sqrt6KissingBound
          use-mathlib-cache: true
      - name: Check complete certificate and allowed axioms
        run: bash scripts/check.sh
