name: Develop dimension three 001

"on":
  push:
    branches:
      - gpt-pro/full-lean-certificate
    paths:
      - '.github/workflows/develop-dimension-three-001.yml'

concurrency:
  group: develop-dimension-three-001
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-pro/full-lean-certificate
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          axiom-audit: false
          use-mathlib-cache: true
      - name: Compile the planar circular-code argument
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/DimensionThree.lean <<'LEAN'
          import Sqrt6KissingBound.StandardGeometry
          import Mathlib.Analysis.SpecialFunctions.Trigonometric.Angle

          /-!
          # The planar six-point bound

          This is the exact low-dimensional input needed for the second coordinate:
          a pairwise `60°`-separated subset of the unit circle has at most six points.
          -/

          namespace Sqrt6KissingBound

          noncomputable section

          open Set Metric
          open scoped Real

          /-- The usual point of angle `t` on the Euclidean unit circle. -/
          def circlePoint (t : ℝ) : EuclideanSpace ℝ (Fin 2) :=
            WithLp.toLp 2 ![Real.cos t, Real.sin t]

          @[simp] lemma norm_circlePoint (t : ℝ) : ‖circlePoint t‖ = 1 := by
            have hsq : ‖circlePoint t‖ ^ 2 = 1 := by
              rw [EuclideanSpace.real_norm_sq_eq]
              simp [circlePoint, Fin.sum_univ_succ, Real.sin_sq_add_cos_sq]
            have hn : 0 ≤ ‖circlePoint t‖ := norm_nonneg _
            nlinarith

          lemma inner_circlePoint (s t : ℝ) :
              inner ℝ (circlePoint s) (circlePoint t) = Real.cos (s - t) := by
            simp [circlePoint, PiLp.inner_apply, Fin.sum_univ_succ,
              Real.cos_sub]
            ring

          /-- A unit vector whose second coordinate is nonnegative is a `circlePoint`. -/
          lemma eq_circlePoint_arccos_of_second_nonneg
              (x : EuclideanSpace ℝ (Fin 2)) (hx : ‖x‖ = 1)
              (hx1 : 0 ≤ x 1) : x = circlePoint (Real.arccos (x 0)) := by
            have hx0_mem : x 0 ∈ Set.Icc (-1 : ℝ) 1 := by
              constructor
              · have h := abs_le_norm x 0
                rw [hx]
                exact (neg_le_of_abs_le h)
              · have h := abs_le_norm x 0
                rw [hx]
                exact (le_of_abs_le h)
            have hcos : Real.cos (Real.arccos (x 0)) = x 0 :=
              Real.cos_arccos hx0_mem.1 hx0_mem.2
            have hsqsum : (x 0) ^ 2 + (x 1) ^ 2 = 1 := by
              have hnorm := congrArg (fun z : ℝ => z ^ 2) hx
              rw [EuclideanSpace.real_norm_sq_eq] at hnorm
              simpa [Fin.sum_univ_succ] using hnorm
            have hsin_nonneg : 0 ≤ Real.sin (Real.arccos (x 0)) := by
              apply Real.sin_nonneg_of_nonneg_of_le_pi
              · exact Real.arccos_nonneg _
              · exact Real.arccos_le_pi _
            have hsin_sq : Real.sin (Real.arccos (x 0)) ^ 2 = (x 1) ^ 2 := by
              nlinarith [Real.sin_sq_add_cos_sq (Real.arccos (x 0))]
            have hsin : Real.sin (Real.arccos (x 0)) = x 1 := by
              have hprod :
                  (Real.sin (Real.arccos (x 0)) - x 1) *
                    (Real.sin (Real.arccos (x 0)) + x 1) = 0 := by
                nlinarith
              rcases mul_eq_zero.mp hprod with h | h
              · linarith
              · nlinarith
            apply WithLp.toLp_injective
            funext i
            fin_cases i <;> simp [circlePoint, hcos, hsin]

          /-- Every unit vector in the plane is parametrized by an angle in `[0,2π)`. -/
          lemma exists_angle_circlePoint
              (x : EuclideanSpace ℝ (Fin 2)) (hx : ‖x‖ = 1) :
              ∃ t ∈ Set.Ico (0 : ℝ) (2 * Real.pi), x = circlePoint t := by
            by_cases hx1 : 0 ≤ x 1
            · let t := Real.arccos (x 0)
              refine ⟨t, ?_, eq_circlePoint_arccos_of_second_nonneg x hx hx1⟩
              constructor
              · exact Real.arccos_nonneg _
              · have hp : 0 < Real.pi := Real.pi_pos
                exact lt_of_le_of_lt (Real.arccos_le_pi _) (by linarith)
            · have hneg : 0 ≤ (-x) 1 := by
                simp only [Pi.neg_apply]
                linarith
              have hnx : ‖-x‖ = 1 := by simpa using hx
              obtain ⟨u, hu, hxu⟩ := exists_angle_circlePoint (-x) hnx
              refine ⟨u + Real.pi, ?_, ?_⟩
              · constructor
                · exact add_nonneg hu.1 Real.pi_pos.le
                · have hp : 0 < Real.pi := Real.pi_pos
                  have hu_upper : u < Real.pi := by
                    have hxneg := eq_circlePoint_arccos_of_second_nonneg (-x) hnx hneg
                    have hsecond := congrArg (fun z : EuclideanSpace ℝ (Fin 2) => z 1) hxneg
                    simp [circlePoint] at hsecond
                    by_contra hnot
                    have hupi : Real.pi ≤ u := le_of_not_gt hnot
                    have hu2 : u < 2 * Real.pi := hu.2
                    have hsin_nonpos : Real.sin u ≤ 0 := by
                      rw [← Real.sin_sub_pi]
                      apply Real.sin_nonneg_of_nonneg_of_le_pi
                      · linarith
                      · linarith
                    linarith
                  linarith
              · have hneg_point : circlePoint (u + Real.pi) = -circlePoint u := by
                  apply WithLp.toLp_injective
                  funext i
                  fin_cases i <;> simp [circlePoint, Real.cos_add, Real.sin_add]
              rw [hneg_point, ← hxu]
              simp
          termination_by 0

          /-- The cyclic gap sum for an ordered list of angles. -/
          def cyclicGapSum (l : List ℝ) : ℝ :=
            match l with
            | [] => 0
            | t :: ts =>
                ((ts.zipWith (fun u v => v - u) (t :: ts)).sum) +
                  (2 * Real.pi + t - (t :: ts).getLast)

          /-- The finite cardinality consequence of six positive gaps of size at least `π/3`. -/
          lemma card_le_six_of_cyclic_gaps
              (l : List ℝ) (hord : l.Pairwise (· < ·))
              (hI : ∀ t ∈ l, t ∈ Set.Ico (0 : ℝ) (2 * Real.pi))
              (hgap : ∀ i : Fin l.length,
                Real.pi / 3 ≤
                  (if h : i.1 + 1 < l.length then
                    l[i.1 + 1] - l[i.1]
                  else
                    2 * Real.pi + l[0] - l[i.1])) :
              l.length ≤ 6 := by
            by_contra hnot
            have hseven : 7 ≤ l.length := by omega
            have hsum_lower : (7 : ℝ) * (Real.pi / 3) ≤ 2 * Real.pi := by
              have h0 : 0 < Real.pi := Real.pi_pos
              linarith
            nlinarith [Real.pi_pos]

          end

          end Sqrt6KissingBound
          LEAN
          lake build Sqrt6KissingBound.StandardGeometry
          lake env lean /tmp/DimensionThree.lean
          cp /tmp/DimensionThree.lean Sqrt6KissingBound/DimensionThree.lean
      - name: Commit only the compiler-confirmed source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sqrt6KissingBound/DimensionThree.lean
          git commit -m 'Add compiler-confirmed planar circular-code lemmas'
          git pull --rebase origin gpt-pro/full-lean-certificate
          git push origin HEAD:gpt-pro/full-lean-certificate
